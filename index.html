    songs:['Fortnight','The Tortured Poets Department','My Boy Only Breaks His Favorite Toys','Down Bad','So Long, London','But Daddy I Love Him','Fresh Out the Slammer','Florida!!!','Guilty as Sin?',"Who's Afraid of Little Old Me?",'I Can Fix Him (No Really I Can)','Loml','I Can Do It with a Broken Heart','The Smallest Man Who Ever Lived','The Alchemy','Clara Bow','The Black Dog','imgonnagetyouback','The Albatross','Chloe or Sam or Sophia or Marcus','How Did It End?','So High School','I Hate It Here','thanK you aIMee',"I Look in People's Windows",'The Prophecy','Cassandra','Peter','The Bolter','Robin','The Manuscript']},

];

// Build flat song list (unique songs only)
const allSongs=[];
albumData.forEach(album=>{album.songs.forEach((song,si)=>{allSongs.push({album,song,songIndex:si});});});
const TOTAL_SONGS=allSongs.length;

// ==================== STATE ====================
const STORAGE_KEY='ts-quiz-v2';
let ratings={};let currentIdx=0;let sortMode='mean';let personalChart=null,globalChart=null;

function loadRatings(){try{const s=localStorage.getItem(STORAGE_KEY);if(s)ratings=JSON.parse(s)}catch(e){ratings={}}}
function saveRatings(){localStorage.setItem(STORAGE_KEY,JSON.stringify(ratings))}
function getRating(aid,si){return(ratings[aid]&&ratings[aid][si]!==undefined)?ratings[aid][si]:-1}
function setRating(aid,si,v){if(!ratings[aid])ratings[aid]={};ratings[aid][si]=v;saveRatings()}
function countRated(){let c=0;albumData.forEach(a=>{a.songs.forEach((_,si)=>{if(getRating(a.id,si)>=1)c++})});return c}

// For TV albums: merge original album's ratings + TV vault ratings
function getMergedRatings(album){
  if(!album.origId)return ratings[album.id]||{};
  const orig=albumData.find(a=>a.id===album.origId);
  const origR=ratings[orig.id]||{};
  const tvR=ratings[album.id]||{};
  // Merge: original songs + tv vault songs (different indices)
  const merged={};
  // Original songs at their indices
  Object.keys(origR).forEach(k=>{if(origR[k]>=1)merged[k]=origR[k]});
  // TV vault songs offset by original album length (mapped to original scale for calculation)
  const offset=orig.songs.length;
  Object.keys(tvR).forEach(k=>{if(tvR[k]>=1)merged[parseInt(k)+offset]=tvR[k]});
  return merged;
}

function calcStats(album){
  if(album.origId){
    // TV album: combine original + vault
    const merged=getMergedRatings(album);
    const orig=albumData.find(a=>a.id===album.origId);
    const totalCount=orig.songs.length+album.songs.length;
    const vals=Object.values(merged).filter(v=>v>=1);
    const n=vals.length;if(n===0)return{mean:null,variance:null,ratedCount:0,totalCount};
    const sum=vals.reduce((a,b)=>a+b,0);const mean=sum/n;
    const variance=vals.reduce((s,v)=>s+(v-mean)**2,0)/n;
    return{mean,variance,ratedCount:n,totalCount};
  }else{
    const albumR=(ratings[album.id]||{});
    const vals=album.songs.map((_,i)=>((albumR[i]!==undefined&&albumR[i]>=1)?albumR[i]:null)).filter(v=>v!==null);
    const n=vals.length;if(n===0)return{mean:null,variance:null,ratedCount:0,totalCount:album.songs.length};
    const sum=vals.reduce((a,b)=>a+b,0);const mean=sum/n;
    const variance=vals.reduce((s,v)=>s+(v-mean)**2,0)/n;
    return{mean,variance,ratedCount:n,totalCount:album.songs.length};
  }
}

function getSorted(){
  const w=albumData.map(a=>({...a,stats:calcStats(a)}));
  w.sort((a,b)=>{
    const va=sortMode==='mean'?a.stats.mean:a.stats.variance;
    const vb=sortMode==='mean'?b.stats.mean:b.stats.variance;
    if(va===null&&vb===null)return 0;if(va===null)return 1;if(vb===null)return-1;
    return sortMode==='mean'?vb-va:va-vb;
  });return w;
}

function initLanding(){
  const bg=document.getElementById('landingBg');
  const covers=albumData.map(a=>a.cover).filter(c=>c);
  for(let i=0;i<22;i++){
    const img=document.createElement('img');img.src=covers[i%covers.length];img.className='cover-float';
    img.style.left=Math.random()*90+'%';img.style.top=Math.random()*90+'%';
    img.style.animationDelay=Math.random()*6+'s';img.style.animationDuration=(5+Math.random()*6)+'s';
    img.onerror=function(){this.remove()};bg.appendChild(img);

// ==================== QUIZ ====================
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz(){currentIdx=0;showPage('pageQuiz');renderQuiz();}
function resumeQuiz(){
  let last=-1;
  for(let i=TOTAL_SONGS-1;i>=0;i--){if(getRating(allSongs[i].album.id,allSongs[i].songIndex)>=1){last=i;break}}
  currentIdx=last>=0?Math.min(last+1,TOTAL_SONGS-1):0;showPage('pageQuiz');renderQuiz();
}

const transitions=['anim-slide-left','anim-slide-right','anim-fade-up','anim-scale','anim-rotate'];
let lastTransition=-1;

function renderQuiz(){
  const s=allSongs[currentIdx];const album=s.album;

  // Transition animation (random, not repeat last)
  let ti;
  do{ti=Math.floor(Math.random()*transitions.length)}while(ti===lastTransition&&transitions.length>1);
  lastTransition=ti;

  const quizMain=document.getElementById('quizMain');
  quizMain.classList.remove(...transitions);
  void quizMain.offsetWidth;
  quizMain.classList.add(transitions[ti]);

  // Background color
  const pageQuiz=document.getElementById('pageQuiz');
  pageQuiz.style.background=album.colorL||'#f5f3f0';
  const textColor=album.color;

  // Progress bar
  document.getElementById('progressFill').style.width=(currentIdx/TOTAL_SONGS*100)+'%';
  document.getElementById('progressFill').style.background=album.color;
  document.getElementById('progressLabel').textContent=`第 ${currentIdx+1} / ${TOTAL_SONGS} 首`;
  document.getElementById('progressAlbum').textContent=album.name+' · '+album.year;
  document.getElementById('quizAlbumLabel').textContent=album.name;
  document.getElementById('quizAlbumLabel').style.color=textColor;

  // Cover
  const cover=document.getElementById('quizCover'),coverPH=document.getElementById('quizCoverPH');
  coverPH.style.background=album.color;
  if(album.cover){cover.src=album.cover;cover.style.display='';coverPH.style.display='none'}
  else{cover.style.display='none';coverPH.style.display='flex'}

  // Prompt
  document.getElementById('quizPrompt').innerHTML='你给 <span style="color:'+textColor+'">'+es(s.song)+'</span> 打几分？';

  // Stars
  const starsRow=document.getElementById('quizStars');
  const r=getRating(album.id,s.songIndex);
  let h='';
  for(let v=1;v<=10;v++)h+=`<button class="star-big${r>=v&&r>=1?' filled':''}" data-val="${v}">★</button>`;
  starsRow.innerHTML=h;
  starsRow.querySelectorAll('.star-big').forEach(btn=>{btn.addEventListener('click',function(){const v=+this.dataset.val;setRating(album.id,s.songIndex,v);starsRow.querySelectorAll('.star-big').forEach((b,j)=>{b.classList.toggle('filled',j+1<=v)});setTimeout(()=>nextSong(),250);});});

  // Nav
  document.getElementById('btnPrev').disabled=currentIdx===0;
  const isLast=currentIdx===TOTAL_SONGS-1;
  document.getElementById('btnNext').textContent=isLast?'完成 ✨':'下一首 →';

  // Emoji background
  renderEmojiBg(album.emoji||'taylor-swift');
}

function nextSong(){
  if(currentIdx<TOTAL_SONGS-1){currentIdx++;renderQuiz()}
  else finishQuiz();
}
function prevSong(){if(currentIdx>0){currentIdx--;renderQuiz()}}

async function finishQuiz(){
  document.getElementById('doneOverlay').classList.add('show');
  try{await sbFetch('album_ratings','POST',{user_id:getUserId(),ratings,updated_at:new Date().toISOString()})}catch(e){}
  localStorage.setItem('ts_quiz_done_v2','true');
  setTimeout(()=>{
    document.getElementById('doneOverlay').classList.remove('show');
    showPage('pageResults');renderResults(true);fetchGlobal();
  },800);
}

// ==================== RESULTS ====================
function renderResults(animate){
  const sorted=getSorted();
  const tb=sorted.reduce((s,a)=>s+a.stats.ratedCount,0);
  const ts=sorted.reduce((s,a)=>s+a.stats.totalCount,0);
  document.getElementById('statsBar').innerHTML=`<div class="stat-chip">已评 <strong>${tb}</strong> / ${ts} 首</div><div class="stat-chip">专辑 <strong>${sorted.length}</strong> 张</div>`;

  const rg=document.getElementById('rankingGrid');
  const old=new Map();
  rg.querySelectorAll('.album-card').forEach(c=>old.set(c.dataset.albumId,c.getBoundingClientRect().top));
  rg.innerHTML=getSorted().map((a,rk)=>buildRankCard(a,rk)).join('');
  rg.querySelectorAll('.album-card').forEach(card=>{
    const ot=old.get(card.dataset.albumId);
    if(ot!==undefined){const d=ot-card.getBoundingClientRect().top;if(Math.abs(d)>0.5){card.style.transform=`translateY(${d}px)`;card.classList.add('animating');requestAnimationFrame(()=>{card.style.transform='translateY(0)'});card.addEventListener('transitionend',function h(){card.classList.remove('animating');card.style.transform='';card.removeEventListener('transitionend',h)})}}
  });
  updateBtns();

  if(personalChart){
    personalChart.data.labels=sorted.map(a=>a.name.length>14?a.name.substring(0,13)+'\u2026':a.name);
    personalChart.data.datasets[0].data=sorted.map(a=>a.stats.mean);
    personalChart.data.datasets[1].data=sorted.map(a=>a.stats.variance);
    personalChart.update(animate?'active':'none');
  }else renderPersonalChart(sorted);
}

function buildRankCard(album,rank){
  const s=album.stats,tvTag=album.tv?' <span class="tag-tv">TV</span>':'';
  return `<div class="album-card" data-album-id="${album.id}" style="border-left-color:${album.color}">
    <div class="album-card-inner">
      <div class="album-cover-wrap">${album.cover?`<img src="${album.cover}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />`:''}<div class="album-cover-placeholder" style="background:${album.color};${album.cover?'display:none':''}">🎵</div></div>
      <div class="album-info"><div class="album-header-row"><span class="album-name">${es(album.name)}${tvTag}</span><span class="album-year">${album.year}</span></div><div class="album-stats"><span class="album-stat">平均 <span>${s.mean!==null?s.mean.toFixed(2):'—'}</span></span><span class="album-stat">方差 <span>${s.variance!==null?s.variance.toFixed(2):'—'}</span></span><span class="album-stat">已评 <span>${s.ratedCount}/${s.totalCount}</span></span></div></div>
      <div class="album-rank">#${rank+1}</div>
    </div></div>`;
}

function renderPersonalChart(sorted){
  personalChart=new Chart(document.getElementById('chartCanvas').getContext('2d'),{
    type:'line',data:{labels:sorted.map(a=>a.name.length>14?a.name.substring(0,13)+'\u2026':a.name),datasets:[
      {label:'平均分',data:sorted.map(a=>a.stats.mean),borderColor:'#c9a96e',backgroundColor:'rgba(201,169,110,0.08)',borderWidth:2.5,pointRadius:5,pointBackgroundColor:'#c9a96e',pointBorderColor:'#1a1a1a',pointBorderWidth:2,tension:0.35,fill:true,yAxisID:'y',order:1},
      {label:'方差',data:sorted.map(a=>a.stats.variance),borderColor:'#7b9eaf',backgroundColor:'rgba(123,158,175,0.08)',borderWidth:2.5,pointRadius:5,pointBackgroundColor:'#7b9eaf',pointBorderColor:'#1a1a1a',pointBorderWidth:2,tension:0.35,borderDash:[6,3],fill:true,yAxisID:'y1',order:2}]},
    options:{responsive:true,maintainAspectRatio:true,interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'top',labels:{usePointStyle:true,pointStyleWidth:10,padding:25,font:{size:12},color:'#a09888'}},tooltip:{backgroundColor:'#2a2a2a',titleFont:{size:12},bodyFont:{size:11},padding:10,cornerRadius:8}},
      scales:{x:{ticks:{font:{size:10},color:'#a09888',maxRotation:45,minRotation:0},grid:{display:false}},
        y:{type:'linear',position:'left',min:1,max:10,ticks:{stepSize:1,font:{size:10},color:'#c9a96e'},grid:{color:'rgba(255,255,255,0.06)'},title:{display:true,text:'平均分',color:'#c9a96e',font:{size:11,weight:'600'}}},
        y1:{type:'linear',position:'right',min:0,ticks:{font:{size:10},color:'#7b9eaf',callback:v=>v.toFixed(1)},grid:{drawOnChartArea:false},title:{display:true,text:'方差',color:'#7b9eaf',font:{size:11,weight:'600'}}}},
      animation:{duration:600,easing:'easeInOutQuart'}}
  });
}

// ==================== GLOBAL ====================
async function fetchGlobal(){
  try{
    const res=await sbFetch('album_ratings?select=ratings','GET');
    const data=await res.json();
    if(!data||!data.length){showToast('暂无全体数据');return}
    const agg={};albumData.forEach(a=>{agg[a.id]={sum:0,count:0,origCount:0}});let totalUsers=0;
    data.forEach(row=>{if(!row.ratings)return;totalUsers++;
      albumData.forEach(album=>{
        if(album.origId){
          // TV: merge original + vault
          const orig=albumData.find(a=>a.id===album.origId);
          const origR=row.ratings[orig.id]||{};
          const tvR=row.ratings[album.id]||{};
          Object.keys(origR).forEach(k=>{if(origR[k]>=1){agg[album.id].sum+=origR[k];agg[album.id].count++}});
          Object.keys(tvR).forEach(k=>{if(tvR[k]>=1){agg[album.id].sum+=tvR[k];agg[album.id].count++}});
          agg[album.id].origCount=orig.songs.length+album.songs.length;
        }else{
          const ar=row.ratings[album.id];if(!ar)return;
          Object.keys(ar).forEach(k=>{if(ar[k]>=1){agg[album.id].sum+=ar[k];agg[album.id].count++}});
        }
      });
    });
    const gs=albumData.map(album=>({...album,stats:{mean:agg[album.id].count>0?agg[album.id].sum/agg[album.id].count:null,ratedCount:agg[album.id].count,userCount:totalUsers}}));
    gs.sort((a,b)=>(a.stats.mean===null?1:b.stats.mean===null?-1:b.stats.mean-a.stats.mean));
    document.getElementById('globalStatsBar').innerHTML=`<div class="stat-chip">参与 <strong>${totalUsers}</strong> 人</div>`;
    document.getElementById('globalRankingGrid').innerHTML=gs.map((album,rank)=>{
      const s=album.stats,tvTag=album.tv?' <span class="tag-tv">TV</span>':'';
      return `<div class="album-card" style="border-left-color:${album.color}"><div class="album-card-inner"><div class="album-cover-wrap">${album.cover?`<img src="${album.cover}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />`:''}<div class="album-cover-placeholder" style="background:${album.color};${album.cover?'display:none':''}">🎵</div></div><div class="album-info"><div class="album-header-row"><span class="album-name">${es(album.name)}${tvTag}</span><span class="album-year">${album.year}</span></div><div class="album-stats"><span class="album-stat">总平均 <span>${s.mean!==null?s.mean.toFixed(2):'—'}</span></span><span class="album-stat">人次 <span>${s.ratedCount}</span></span></div></div><div class="album-rank">#${rank+1}</div></div></div>`;
    }).join('');
    renderGlobalChart(gs);
  }catch(e){console.error(e)}
}

function renderGlobalChart(stats){
  if(globalChart)globalChart.destroy();
  const labeled=stats.filter(a=>a.stats.mean!==null);
  globalChart=new Chart(document.getElementById('globalChartCanvas').getContext('2d'),{
    type:'bar',data:{labels:labeled.map(a=>a.name.length>12?a.name.substring(0,11)+'\u2026':a.name),datasets:[{data:labeled.map(a=>a.stats.mean),backgroundColor:labeled.map(a=>a.color+'99'),borderColor:labeled.map(a=>a.color),borderWidth:2,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{backgroundColor:'#2a2a2a',padding:10,cornerRadius:8}},scales:{x:{ticks:{font:{size:9},color:'#a09888',maxRotation:45},grid:{display:false}},y:{min:1,max:10,ticks:{stepSize:1,font:{size:10},color:'#a09888'},grid:{color:'rgba(255,255,255,0.06)'}}},animation:{duration:600}}
  });
}

  document.body.appendChild(ed);
  try{const cnv=await html2canvas(ed,{scale:2,backgroundColor:'#0d0d0d',allowTaint:true,useCORS:false});const a=document.createElement('a');a.download='ts-album-ranking.png';a.href=cnv.toDataURL('image/png');a.click();showToast('图片已导出')}catch(e){showToast('导出失败（部署后正常）')}
  document.body.removeChild(ed);
});

// ==================== HELPERS ====================
function updateBtns(){document.getElementById('btnMean').classList.toggle('active',sortMode==='mean');document.getElementById('btnVar').classList.toggle('active',sortMode==='variance')}
function es(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function restartQuiz(){ratings={};saveRatings();localStorage.removeItem('ts_quiz_done_v2');currentIdx=0;showPage('pageLanding');initLanding()}

// ==================== INIT ====================
loadRatings();initLanding();
if(localStorage.getItem('ts_quiz_done_v2')){showPage('pageResults');renderResults(true);fetchGlobal()}
