    songs:['Electric Touch','When Emma Falls in Love','I Can See You','Castles Crumbling','Foolish One','Timeless']},
  '1989':{color:'#8cc8e4',colorL:'#daeff7',cover:'images/1989_tv_2023.jpg',year:2023,
    songs:['"Slut!"','Say Don\'t Go','Now That We Don\'t Talk','Suburban Legends','Is It Over Now?']}
};

// Build quiz sequence: original songs then TV vaults
const quizSongs=[];
const songMeta=[]; // parallel: {albumId, songIdx, isVault}
albumDefs.forEach(alb=>{
  alb.songs.forEach((song,si)=>{quizSongs.push(song);songMeta.push({albumId:alb.id,songIdx:si,isVault:false});});
  if(tvVaults[alb.id]){
    const tv=tvVaults[alb.id];
    tv.songs.forEach((song,si)=>{quizSongs.push(song);songMeta.push({albumId:alb.id,songIdx:alb.songs.length+si,isVault:true});});
  }
});
const TOTAL=quizSongs.length;

// ==================== STATE ====================
const SK='ts-quiz-v3';
let ratings={};let ci=0;let sm='mean';let pc=null,gc=null,submitted=false;
function loadR(){try{const s=localStorage.getItem(SK);if(s)ratings=JSON.parse(s)}catch(e){ratings={}};submitted=!!localStorage.getItem('ts_done_v3')}
function saveR(){localStorage.setItem(SK,JSON.stringify(ratings))}
function getR(aid,si){return(ratings[aid]&&ratings[aid][si]!==undefined)?ratings[aid][si]:0}
function setR(aid,si,v){if(!ratings[aid])ratings[aid]={};ratings[aid][si]=v;saveR()}
function cntR(){let c=0;albumDefs.forEach(a=>{a.songs.forEach((_,si)=>{if(getR(a.id,si)>=1)c++});if(tvVaults[a.id]){tvVaults[a.id].songs.forEach((_,si)=>{if(getR(a.id,a.songs.length+si)>=1)c++})}});return c}

// For merged albums: combine original + vault into one stats entry
function calcMerged(alb){
  const origN=alb.songs.length;
  const tv=tvVaults[alb.id];const vaultN=tv?tv.songs.length:0;
  const totalN=origN+vaultN;
  let vals=[];
  alb.songs.forEach((_,si)=>{const v=getR(alb.id,si);if(v>=1)vals.push(v)});
  if(tv){tv.songs.forEach((_,si)=>{const v=getR(alb.id,origN+si);if(v>=1)vals.push(v)})}
  const n=vals.length;if(n===0)return{mean:null,variance:null,rc:0,total:totalN};
  const sum=vals.reduce((a,b)=>a+b,0);const mean=sum/n;
  return{mean,variance:vals.reduce((s,v)=>s+(v-mean)**2,0)/n,rc:n,total:totalN};
}

function getDisplayAlbums(){
  return albumDefs.map(alb=>({...alb,stats:calcMerged(alb)}));
}

function getSorted(){
  const w=getDisplayAlbums();
  w.sort((a,b)=>{
    const va=sm==='mean'?a.stats.mean:a.stats.variance;
    const vb=sm==='mean'?b.stats.mean:b.stats.variance;
    if(va===null&&vb===null)return 0;if(va===null)return 1;if(vb===null)return-1;
    return sm==='mean'?vb-va:va-vb;
  });return w;
}

// ==================== LANDING ====================
function initLanding(){
  const bg=document.getElementById('landingBg');
  const covers=albumDefs.map(a=>a.cover).filter(c=>c);
  for(let i=0;i<22;i++){const img=document.createElement('img');img.src=covers[i%covers.length];img.className='cover-float';img.style.left=Math.random()*90+'%';img.style.top=Math.random()*90+'%';img.style.animationDelay=Math.random()*6+'s';img.style.animationDuration=(5+Math.random()*6)+'s';img.onerror=function(){this.remove()};bg.appendChild(img)}
  if(cntR()>0)document.getElementById('btnResume').style.display='';
}

// ==================== EMOJI ====================
function renderEmoji(aid){
  const bg=document.getElementById('emojiBg');
  const alb=albumDefs.find(a=>a.id===aid)||{emoji:'taylor-swift'};
  const es=emojiSets[alb.emoji]||emojiSets['taylor-swift'];
  bg.innerHTML='';
  for(let i=0;i<28;i++){const s=document.createElement('span');s.textContent=es[i%es.length];s.style.left=Math.random()*95+'%';s.style.top=Math.random()*95+'%';s.style.animationDelay=Math.random()*8+'s';s.style.animationDuration=(6+Math.random()*7)+'s';s.style.fontSize=(1.2+Math.random()*2)+'rem';bg.appendChild(s)}
}

// ==================== QUIZ ====================
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}
function startQuiz(){ci=0;showPage('pageQuiz');renderQuiz()}
function resumeQuiz(){let last=-1;for(let i=TOTAL-1;i>=0;i--){const m=songMeta[i];if(getR(m.albumId,m.songIdx)>=1){last=i;break}}ci=last>=0?Math.min(last+1,TOTAL-1):0;showPage('pageQuiz');renderQuiz()}

let lastAlbumId=null;

function renderQuiz(){
  const meta=songMeta[ci];const alb=albumDefs.find(a=>a.id===meta.albumId);
  const isVault=meta.isVault;
  const albumChanged=!lastAlbumId||lastAlbumId!==meta.albumId;
  
  // Determine current display info
  let dispCover,dispColor,dispColorL,dispName,dispYear;
  if(isVault){
    const tv=tvVaults[meta.albumId];
    dispCover=tv.cover;dispColor=tv.color;dispColorL=tv.colorL;dispName=alb.name+' (TV)';dispYear=tv.year;
  }else{
    dispCover=alb.cover;dispColor=alb.color;dispColorL=alb.colorL;dispName=alb.name;dispYear=alb.year;
  }

  // Full animation if album changed
  const qm=document.getElementById('quizMain');
  if(albumChanged){
    lastAlbumId=meta.albumId;
    qm.classList.remove('anim-full');void qm.offsetWidth;qm.classList.add('anim-full');
    // Also animate cover
    document.getElementById('qCover').style.transition='all .4s ease';
    document.getElementById('emojiBg').style.opacity='0';
    setTimeout(()=>{renderEmoji(meta.albumId);document.getElementById('emojiBg').style.opacity='0.3'},200);
  }

  // Background
  document.getElementById('pageQuiz').style.background=dispColorL||'#f5f3f0';

  // Progress
  document.getElementById('pbFill').style.width=(ci/TOTAL*100)+'%';
  document.getElementById('pbFill').style.background=dispColor;
  document.getElementById('pbLabel').textContent=`第 ${ci+1} / ${TOTAL} 首`;
  document.getElementById('pbAlbum').textContent=dispName+' · '+dispYear;
  document.getElementById('qLabel').textContent=dispName;
  document.getElementById('qLabel').style.color=dispColor;

  // Cover
  const cov=document.getElementById('qCover'),cph=document.getElementById('qCoverPH');
  cph.style.background=dispColor;
  if(dispCover){cov.src=dispCover;cov.style.display='';cph.style.display='none'}else{cov.style.display='none';cph.style.display='flex'}

  // Prompt - always animate
  const prompt=document.getElementById('qPrompt');
  prompt.classList.remove('anim');void prompt.offsetWidth;prompt.classList.add('anim');
  prompt.innerHTML='你给 <span style="color:'+dispColor+'">'+es(quizSongs[ci])+'</span> 打几分？';

  // Number buttons
  const nr=document.getElementById('qNums');
  const r=getR(meta.albumId,meta.songIdx);
  let h='';
  for(let v=1;v<=10;v++)h+=`<button class="num-btn${r===v?' selected':''}" data-val="${v}">${v}</button>`;
  nr.innerHTML=h;
  nr.querySelectorAll('.num-btn').forEach(btn=>{btn.addEventListener('click',function(){const v=+this.dataset.val;setR(meta.albumId,meta.songIdx,v);nr.querySelectorAll('.num-btn').forEach(b=>b.classList.toggle('selected',+b.dataset.val===v));setTimeout(()=>nextSong(),300);})});

  document.getElementById('btnPrev').disabled=ci===0;
  document.getElementById('btnNext').textContent=ci===TOTAL-1?'完成 ✨':'→';
}

function nextSong(){if(ci<TOTAL-1){ci++;renderQuiz()}else finishQuiz()}
function prevSong(){if(ci>0){ci--;renderQuiz()}}

async function finishQuiz(){
  document.getElementById('doneOverlay').classList.add('show');
  try{await sbFetch('album_ratings','POST',{user_id:uid(),ratings,updated_at:new Date().toISOString()})}catch(e){}
  submitted=true;localStorage.setItem('ts_done_v3','true');
  setTimeout(()=>{document.getElementById('doneOverlay').classList.remove('show');showPage('pageResults');renderResults(true);fetchGlobal()},800);
}

// ==================== RESULTS ====================
function renderResults(animate){
  const sorted=getSorted();
  const tb=sorted.reduce((s,a)=>s+a.stats.rc,0);
  const ts=sorted.reduce((s,a)=>s+a.stats.total,0);
  document.getElementById('statsBar').innerHTML=`<div class="stat-chip">已评 <strong>${tb}</strong> / ${ts} 首</div><div class="stat-chip">专辑 <strong>${sorted.length}</strong> 张</div>`;

  const rg=document.getElementById('rankingGrid');
  const old=new Map();rg.querySelectorAll('.acard').forEach(c=>old.set(c.dataset.aid,c.getBoundingClientRect().top));
  rg.innerHTML=getSorted().map((a,rk)=>buildRankCard(a,rk)).join('');
  rg.querySelectorAll('.acard').forEach(card=>{
    const ot=old.get(card.dataset.aid);if(ot!==undefined){const d=ot-card.getBoundingClientRect().top;if(Math.abs(d)>.5){card.style.transform=`translateY(${d}px)`;card.classList.add('animating');requestAnimationFrame(()=>{card.style.transform='translateY(0)'});card.addEventListener('transitionend',function h(){card.classList.remove('animating');card.style.transform='';card.removeEventListener('transitionend',h)})}}
  });
  updateBtns();
  const labels=sorted.map(a=>a.name.length>14?a.name.substring(0,13)+'\u2026':a.name);
  if(pc){pc.data.labels=labels;pc.data.datasets[0].data=sorted.map(a=>a.stats.mean);pc.data.datasets[1].data=sorted.map(a=>a.stats.variance);pc.update(animate?'active':'none')}else renderChart(sorted);
}

function buildRankCard(alb,rank){
  const s=alb.stats;
  let coverHTML='';
  if(alb.merged&&alb.tvCover){
    coverHTML=`<div class="split split-tl"><img src="${alb.cover}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.style.background='${alb.color}'" /></div><div class="split split-br"><img src="${alb.tvCover}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.style.background='${alb.tvColor}'" /></div>`;
  }else if(alb.cover){
    coverHTML=`<img src="${alb.cover}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="acard-ph" style="background:${alb.color};display:none">🎵</div>`;
  }
  return `<div class="acard" data-aid="${alb.id}" style="border-left-color:${alb.color}">
    <div class="acard-inner">
      <div class="acard-cover">${coverHTML}</div>
      <div class="acard-info"><div class="acard-hd"><span class="acard-name">${es(alb.name)}</span><span class="acard-year">${alb.merged?'2008-'+alb.year:alb.year}</span></div><div class="acard-stats"><span class="acard-stat">均 <span>${s.mean!==null?s.mean.toFixed(2):'—'}</span></span><span class="acard-stat">方 <span>${s.variance!==null?s.variance.toFixed(2):'—'}</span></span><span class="acard-stat">评 <span>${s.rc}/${s.total}</span></span></div></div>
      <div class="acard-rank">#${rank+1}</div>
    </div></div>`;
}

function renderChart(sorted){
  pc=new Chart(document.getElementById('chartCanvas').getContext('2d'),{
    type:'line',data:{labels:sorted.map(a=>a.name.length>14?a.name.substring(0,13)+'\u2026':a.name),datasets:[
      {label:'平均分',data:sorted.map(a=>a.stats.mean),borderColor:'#c9a96e',backgroundColor:'rgba(201,169,110,.08)',borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#c9a96e',pointBorderColor:'#1a1a1a',pointBorderWidth:2,tension:.35,fill:true,yAxisID:'y',order:1},
      {label:'方差',data:sorted.map(a=>a.stats.variance),borderColor:'#7b9eaf',backgroundColor:'rgba(123,158,175,.08)',borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#7b9eaf',pointBorderColor:'#1a1a1a',pointBorderWidth:2,tension:.35,borderDash:[6,3],fill:true,yAxisID:'y1',order:2}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'top',labels:{usePointStyle:true,pointStyleWidth:8,padding:18,font:{size:11},color:'#a09888'}},tooltip:{backgroundColor:'#2a2a2a',titleFont:{size:11},bodyFont:{size:10},padding:8,cornerRadius:6}},
      scales:{x:{ticks:{font:{size:9},color:'#a09888',maxRotation:45,minRotation:0},grid:{display:false}},
        y:{type:'linear',position:'left',min:1,max:10,ticks:{stepSize:2,font:{size:9},color:'#c9a96e'},grid:{color:'rgba(255,255,255,.06)'},title:{display:true,text:'平均分',color:'#c9a96e',font:{size:10,weight:'600'}}},
        y1:{type:'linear',position:'right',min:0,ticks:{font:{size:9},color:'#7b9eaf',callback:v=>v.toFixed(1)},grid:{drawOnChartArea:false},title:{display:true,text:'方差',color:'#7b9eaf',font:{size:10,weight:'600'}}}},
      animation:{duration:500}}
  });
}

// ==================== GLOBAL ====================
async function fetchGlobal(){
  try{const res=await sbFetch('album_ratings?select=ratings','GET');const data=await res.json();if(!data||!data.length){showT('暂无全体数据');return}
    const agg={};albumDefs.forEach(a=>{agg[a.id]={sum:0,count:0}});let tu=0;
    data.forEach(row=>{if(!row.ratings)return;tu++;
      albumDefs.forEach(alb=>{
        const origN=alb.songs.length,tv=tvVaults[alb.id];const tvN=tv?tv.songs.length:0;
        alb.songs.forEach((_,si)=>{const v=(row.ratings[alb.id]||{})[si];if(v&&v>=1){agg[alb.id].sum+=v;agg[alb.id].count++}});
        if(tv){tv.songs.forEach((_,si)=>{const v=(row.ratings[alb.id]||{})[origN+si];if(v&&v>=1){agg[alb.id].sum+=v;agg[alb.id].count++}})}
      });
    });
    const gs=albumDefs.map(alb=>({...alb,stats:{mean:agg[alb.id].count>0?agg[alb.id].sum/agg[alb.id].count:null,rc:agg[alb.id].count,tu}}));
    gs.sort((a,b)=>(a.stats.mean===null?1:b.stats.mean===null?-1:b.stats.mean-a.stats.mean));
    document.getElementById('gStatsBar').innerHTML=`<div class="stat-chip">参与 <strong>${tu}</strong> 人</div>`;
    document.getElementById('gRankingGrid').innerHTML=gs.map((alb,rank)=>{
      const s=alb.stats;let coverHTML='';
      if(alb.merged&&alb.tvCover){coverHTML=`<div class="split split-tl"><img src="${alb.cover}" style="width:100%;height:100%;object-fit:cover" /></div><div class="split split-br"><img src="${alb.tvCover}" style="width:100%;height:100%;object-fit:cover" /></div>`}else if(alb.cover){coverHTML=`<img src="${alb.cover}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="acard-ph" style="background:${alb.color};display:none">🎵</div>`}
      return `<div class="acard" style="border-left-color:${alb.color}"><div class="acard-inner"><div class="acard-cover">${coverHTML}</div><div class="acard-info"><div class="acard-hd"><span class="acard-name">${es(alb.name)}</span><span class="acard-year">${alb.merged?'2008-'+alb.year:alb.year}</span></div><div class="acard-stats"><span class="acard-stat">均 <span>${s.mean!==null?s.mean.toFixed(2):'—'}</span></span><span class="acard-stat">次 <span>${s.rc}</span></span></div></div><div class="acard-rank">#${rank+1}</div></div></div>`;
    }).join('');
    renderGChart(gs);
  }catch(e){console.error(e)}
}
function renderGChart(stats){
  if(gc)gc.destroy();const lb=stats.filter(a=>a.stats.mean!==null);
  gc=new Chart(document.getElementById('gChartCanvas').getContext('2d'),{type:'bar',data:{labels:lb.map(function(a){return a.name.length>12?a.name.substring(0,11)+'...':a.name}),datasets:[{data:lb.map(function(a){return a.stats.mean}),backgroundColor:lb.map(function(a){return a.color+'99'}),borderColor:lb.map(function(a){return a.color}),borderWidth:2,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:8},color:'#a09888',maxRotation:45},grid:{display:false}},y:{min:1,max:10,ticks:{stepSize:2,font:{size:9},color:'#a09888'},grid:{color:'rgba(255,255,255,0.06)'}}},animation:{duration:500}});
}

// ==================== TOGGLE ====================
document.getElementById('btnMean').addEventListener('click',()=>{if(sm!=='mean'){sm='mean';renderResults(true)}});
document.getElementById('btnVar').addEventListener('click',()=>{if(sm!=='variance'){sm='variance';renderResults(true)}});

// ==================== EXPORT ====================
document.getElementById('btnExport').addEventListener('click',async function(){
  const ea=document.getElementById('exportArea');const origBg=ea.style.background;ea.style.background='#0d0d0d';
  try{const cnv=await html2canvas(ea,{scale:2,backgroundColor:'#0d0d0d',allowTaint:true,useCORS:false,width:ea.scrollWidth,height:ea.scrollHeight});const a=document.createElement('a');a.download='ts-ranking.png';a.href=cnv.toDataURL('image/png');a.click();showT('已导出')}catch(e){showT('导出失败')}
  ea.style.background=origBg;
});

// ==================== HELPERS ====================
function updateBtns(){document.getElementById('btnMean').classList.toggle('active',sm==='mean');document.getElementById('btnVar').classList.toggle('active',sm==='variance')}
function es(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function showT(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function restartQuiz(){ratings={};saveR();localStorage.removeItem('ts_done_v3');ci=0;lastAlbumId=null;submitted=false;showPage('pageLanding');initLanding()}

loadR();initLanding();
if(submitted){showPage('pageResults');renderResults(true);fetchGlobal()}
</script>
