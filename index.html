var allSongs=[],allMeta=[];
for(var i=0;i<albums.length;i++){
  var alb=albums[i],aid=alb.id,songs=origSongs[aid];
  for(var j=0;j<songs.length;j++){allSongs.push(songs[j]);allMeta.push({aid:aid,si:j,vt:0});}
  if(tvVaultSongs[aid]){
    var tv=tvVaultSongs[aid];
    for(var k=0;k<tv.s.length;k++){allSongs.push(tv.s[k]);allMeta.push({aid:aid,si:songs.length+k,vt:1});}
  }
}
var TOTAL=allSongs.length;

/* ==================== STATE ==================== */
var ratings={},ci=0,sm='mean',pc=null,gc=null;
function loadR(){try{var s=localStorage.getItem('ts-quiz-v5');if(s)ratings=JSON.parse(s)}catch(e){ratings={}}}
function saveR(){localStorage.setItem('ts-quiz-v5',JSON.stringify(ratings))}
function getR(aid,si){return(ratings[aid]&&ratings[aid][si]>=1)?ratings[aid][si]:0}
function setR(aid,si,v){if(!ratings[aid])ratings[aid]={};ratings[aid][si]=v;saveR()}
function cntR(){var c=0;for(var i=0;i<albums.length;i++){var a=albums[i],id=a.id;for(var j=0;j<origSongs[id].length;j++){if(getR(id,j)>=1)c++}if(tvVaultSongs[id]){for(var k=0;k<tvVaultSongs[id].s.length;k++){if(getR(id,origSongs[id].length+k)>=1)c++}}}return c}

function calcStats(aid){
  var o=origSongs[aid];var tv=tvVaultSongs[aid];
  var total=(tv?o.length+tv.s.length:o.length),vals=[];
  for(var i=0;i<o.length;i++){var v=getR(aid,i);if(v>=1)vals.push(v)}
  if(tv){for(var j=0;j<tv.s.length;j++){var v2=getR(aid,o.length+j);if(v2>=1)vals.push(v2)}}
  var n=vals.length;if(n===0)return{mean:null,vr:null,rc:0,tl:total};
  var sum=0;for(var k=0;k<vals.length;k++)sum+=vals[k];
  var mean=sum/n,vr=0;for(var m=0;m<vals.length;m++)vr+=(vals[m]-mean)*(vals[m]-mean);vr/=n;
  return{mean:mean,vr:vr,rc:n,tl:total};
}

function getSorted(){
  var w=[];
  for(var i=0;i<albums.length;i++){
    var a=albums[i];var copy={id:a.id,name:a.name,yr:a.yr,c:a.c,mg:a.mg,tvCv:a.tvCv,cv:a.cv};
    copy.stats=calcStats(a.id);w.push(copy);
  }
  w.sort(function(a,b){var va=sm==='mean'?a.stats.mean:a.stats.vr;var vb=sm==='mean'?b.stats.mean:b.stats.vr;if(va===null&&vb===null)return 0;if(va===null)return 1;if(vb===null)return-1;return sm==='mean'?vb-va:va-vb});
  return w;
}

/* ==================== RENDER ==================== */
function initLanding(){
  var bg=document.getElementById('landingBg');
  var cvs=[];for(var i=0;i<albums.length;i++){if(albums[i].cv)cvs.push(albums[i].cv)}
  for(var j=0;j<22;j++){var img=document.createElement('img');img.src=cvs[j%cvs.length];img.className='cover-float';img.style.left=Math.random()*90+'%';img.style.top=Math.random()*90+'%';img.style.animationDelay=Math.random()*6+'s';img.style.animationDuration=(5+Math.random()*6)+'s';img.onerror=function(){this.remove()};bg.appendChild(img)}
  if(cntR()>0)document.getElementById('btnResume').style.display='';
  if(localStorage.getItem('ts_quiz_completed_v5'))document.getElementById('btnViewResults').style.display='';
}

function viewResults(){showPage('pageResults');renderResults(true);fetchGlobal();}

function renderEmoji(aid){
  var bg=document.getElementById('emojiBg');
  var es=emojiSets[aid]||emojiSets['ts'];
  bg.innerHTML='';
  for(var j=0;j<28;j++){var s=document.createElement('span');s.textContent=es[j%es.length];s.style.left=Math.random()*95+'%';s.style.top=Math.random()*95+'%';s.style.animationDelay=Math.random()*8+'s';s.style.animationDuration=(6+Math.random()*7)+'s';s.style.fontSize=(1.2+Math.random()*2)+'rem';bg.appendChild(s)}
}

function showPage(id){
  var ps=document.querySelectorAll('.page');for(var i=0;i<ps.length;i++)ps[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

function startQuiz(){ci=0;showPage('pageQuiz');renderQuiz()}
function resumeQuiz(){var last=-1;for(var i=TOTAL-1;i>=0;i--){var m=allMeta[i];if(getR(m.aid,m.si)>=1){last=i;break}}ci=last>=0?Math.min(last+1,TOTAL-1):0;showPage('pageQuiz');renderQuiz()}

var lastAlbumId=null;

function renderQuiz(){
  var m=allMeta[ci],vt=m.vt,albumChanged=(lastAlbumId!==m.aid);
  if(albumChanged)lastAlbumId=m.aid;

  var dc,dc2,dcL,dNm,dYr;
  if(vt){
    var tv=tvVaultSongs[m.aid];dc=tv.cv;dc2=tv.c;dcL=tv.cl;dNm=getAlbName(m.aid)+' (TV)';dYr=tv.yr;
  }else{
    var alb=getAlbum(m.aid);dc=alb.cv;dc2=alb.c;dcL=alb.cl;dNm=alb.name;dYr=alb.yr;
  }

  if(albumChanged){
    document.getElementById('quizMain').style.animation='none';document.getElementById('quizMain').offsetHeight;
    document.getElementById('quizMain').style.animation='fadeUpBig .35s ease-out';
  }
  document.getElementById('pageQuiz').style.background=dcL||'#f5f3f0';
  document.getElementById('pbFill').style.width=(ci/TOTAL*100)+'%';
  document.getElementById('pbFill').style.background=dc2;
  document.getElementById('pbLabel').textContent='第 '+(ci+1)+' / '+TOTAL+' 首';
  document.getElementById('pbAlbum').textContent=dNm+' · '+dYr;
  document.getElementById('qLabel').textContent=dNm;
  document.getElementById('qLabel').style.color=dc2;

  var cov=document.getElementById('qCover'),cph=document.getElementById('qCoverPH');
  cph.style.background=dc2;
  if(dc){cov.src=dc;cov.style.display='';cph.style.display='none'}else{cov.style.display='none';cph.style.display='flex'}

  document.getElementById('qPrompt').innerHTML='你给 <span style="color:'+dc2+'">'+escapeText(allSongs[ci])+'</span> 打几分？';

  var nr=document.getElementById('qNums'),r=getR(m.aid,m.si),h='';
  for(var v=1;v<=10;v++)h+='<button class="num-btn'+(r===v?' sel':'')+'" data-val="'+v+'">'+v+'</button>';
  nr.innerHTML=h;
  var btns=nr.querySelectorAll('.num-btn');
  for(var b=0;b<btns.length;b++){btns[b].onclick=function(){var val=+this.dataset.val;setR(m.aid,m.si,val);var bs=nr.querySelectorAll('.num-btn');for(var x=0;x<bs.length;x++){bs[x].classList.toggle('sel',+bs[x].dataset.val===val)}setTimeout(function(){nextSong()},300)}}

  document.getElementById('btnPrev').disabled=ci===0;
  document.getElementById('btnNext').textContent=ci===TOTAL-1?'完成 ✨':'→';
  if(albumChanged){renderEmoji(m.aid)}
}

function nextSong(){if(ci<TOTAL-1){ci++;renderQuiz()}else finishQuiz()}
function prevSong(){if(ci>0){ci--;renderQuiz()}}

function finishQuiz(){
  document.getElementById('doneOverlay').classList.add('show');
  localStorage.setItem('ts_quiz_completed_v5','true');
  var uid=getUid();
  sbPost({user_id:uid,ratings:ratings,updated_at:new Date().toISOString()},function(){},function(){});
  setTimeout(function(){
    document.getElementById('doneOverlay').classList.remove('show');
    showPage('pageResults');renderResults(true);fetchGlobal();
  },800);
}

function renderResults(animate){
  var sorted=getSorted();
  var tb=0,ts=0;for(var i=0;i<sorted.length;i++){tb+=sorted[i].stats.rc;ts+=sorted[i].stats.tl}
  document.getElementById('statsBar').innerHTML='<div class="stat-chip">已评 <strong>'+tb+'</strong> / '+ts+' 首</div><div class="stat-chip">专辑 <strong>'+sorted.length+'</strong> 张</div>';
  var rg=document.getElementById('rankingGrid'),old=new Map();
  rg.querySelectorAll('.acard').forEach(function(c){old.set(c.dataset.aid,c.getBoundingClientRect().top)});
  rg.innerHTML=getSorted().map(function(a,rk){return buildCard(a,rk)}).join('');
  rg.querySelectorAll('.acard').forEach(function(card){
    var ot=old.get(card.dataset.aid);if(ot!==undefined){var d=ot-card.getBoundingClientRect().top;if(Math.abs(d)>.5){card.style.transform='translateY('+d+'px)';card.classList.add('animating');requestAnimationFrame(function(){card.style.transform='translateY(0)'});card.addEventListener('transitionend',function h(){card.classList.remove('animating');card.style.transform='';card.removeEventListener('transitionend',h)})}}
  });
  document.getElementById('btnMean').classList.toggle('active',sm==='mean');
  document.getElementById('btnVar').classList.toggle('active',sm==='variance');
  renderChart(sorted);
}

function buildCard(alb,rk){
  var s=alb.stats,ch='';
  if(alb.mg&&alb.tvCv){ch='<div class="split split-tl"><img src="'+alb.cv+'" style="width:100%;height:100%;object-fit:cover" /></div><div class="split split-br"><img src="'+alb.tvCv+'" style="width:100%;height:100%;object-fit:cover" /></div>'}
  else{ch='<img src="'+alb.cv+'" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" /><div class="acard-ph" style="background:'+alb.c+';display:none">🎵</div>'}
  return '<div class="acard" data-aid="'+alb.id+'" style="border-left-color:'+alb.c+'"><div class="acard-inner"><div class="acard-cover">'+ch+'</div><div class="acard-info"><div class="acard-hd"><span class="acard-name">'+escapeText(alb.name)+'</span><span class="acard-year">'+(alb.mg?'2008-'+alb.yr:alb.yr)+'</span></div><div class="acard-stats"><span class="acard-stat">均 <span>'+(s.mean!==null?s.mean.toFixed(2):'—')+'</span></span><span class="acard-stat">方 <span>'+(s.vr!==null?s.vr.toFixed(2):'—')+'</span></span><span class="acard-stat">评 <span>'+s.rc+'/'+s.tl+'</span></span></div></div><div class="acard-rank">#'+(rk+1)+'</div></div></div>';
}

function renderChart(sorted){
  if(pc)pc.destroy();
  var ctx=document.getElementById('chartCanvas').getContext('2d');
  var lbls=[],means=[],vrs=[],l;
  for(var i=0;i<sorted.length;i++){l=sorted[i];lbls.push(l.name.length>14?l.name.substring(0,13)+'…':l.name);means.push(l.stats.mean);vrs.push(l.stats.vr)}
  pc=new Chart(ctx,{type:'line',data:{labels:lbls,datasets:[
    {label:'平均分',data:means,borderColor:'#c9a96e',backgroundColor:'rgba(201,169,110,0.08)',borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#c9a96e',pointBorderColor:'#1a1a1a',pointBorderWidth:2,tension:0.35,fill:true,yAxisID:'y',order:1},
    {label:'方差',data:vrs,borderColor:'#7b9eaf',backgroundColor:'rgba(123,158,175,0.08)',borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#7b9eaf',pointBorderColor:'#1a1a1a',pointBorderWidth:2,tension:0.35,borderDash:[6,3],fill:true,yAxisID:'y1',order:2}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'top',labels:{usePointStyle:true,pointStyleWidth:8,padding:18,font:{size:11},color:'#a09888'}}},
      scales:{x:{ticks:{font:{size:9},color:'#a09888',maxRotation:45},grid:{display:false}},
        y:{type:'linear',position:'left',min:1,max:10,ticks:{stepSize:2,font:{size:9},color:'#c9a96e'},grid:{color:'rgba(255,255,255,0.06)'},title:{display:true,text:'平均分',color:'#c9a96e'}},
        y1:{type:'linear',position:'right',min:0,ticks:{font:{size:9},color:'#7b9eaf',callback:function(v){return v.toFixed(1)}},grid:{drawOnChartArea:false},title:{display:true,text:'方差',color:'#7b9eaf'}}},
      animation:{duration:500}}
  });
}

function fetchGlobal(){
  sbGet(function(data){
    if(!data||!data.length){showT('暂无全体数据');return}
    var agg={};for(var i=0;i<albums.length;i++)agg[albums[i].id]={sum:0,count:0};var tu=0;
    for(var j=0;j<data.length;j++){var row=data[j];if(!row.ratings)continue;tu++;
      for(var k=0;k<albums.length;k++){var alb=albums[k],aid=alb.id,o=origSongs[aid],tv=tvVaultSongs[aid];
        for(var si=0;si<o.length;si++){var v=(row.ratings[aid]||{})[si];if(v&&v>=1){agg[aid].sum+=v;agg[aid].count++}}
        if(tv){for(var ti=0;ti<tv.s.length;ti++){var v2=(row.ratings[aid]||{})[o.length+ti];if(v2&&v2>=1){agg[aid].sum+=v2;agg[aid].count++}}}
      }
    }
    var gs=[];
    for(var m=0;m<albums.length;m++){var ab=albums[m];gs.push({id:ab.id,name:ab.name,c:ab.c,mg:ab.mg,tvCv:ab.tvCv,cv:ab.cv,yr:ab.yr,stats:{mean:agg[ab.id].count>0?agg[ab.id].sum/agg[ab.id].count:null,rc:agg[ab.id].count}})}
    gs.sort(function(a,b){return(a.stats.mean===null?1:b.stats.mean===null?-1:b.stats.mean-a.stats.mean)});
    document.getElementById('gStatsBar').innerHTML='<div class="stat-chip">参与 <strong>'+tu+'</strong> 人</div>';
    document.getElementById('gRankingGrid').innerHTML=gs.map(function(alb,rank){var s=alb.stats,ch='';
      if(alb.mg&&alb.tvCv){ch='<div class="split split-tl"><img src="'+alb.cv+'" style="width:100%;height:100%;object-fit:cover" /></div><div class="split split-br"><img src="'+alb.tvCv+'" style="width:100%;height:100%;object-fit:cover" /></div>'}
      else{ch='<img src="'+alb.cv+'" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" /><div class="acard-ph" style="background:'+alb.c+';display:none">🎵</div>'}
      return '<div class="acard" style="border-left-color:'+alb.c+'"><div class="acard-inner"><div class="acard-cover">'+ch+'</div><div class="acard-info"><div class="acard-hd"><span class="acard-name">'+escapeText(alb.name)+'</span><span class="acard-year">'+(alb.mg?'2008-'+alb.yr:alb.yr)+'</span></div><div class="acard-stats"><span class="acard-stat">均 <span>'+(s.mean!==null?s.mean.toFixed(2):'—')+'</span></span><span class="acard-stat">次 <span>'+s.rc+'</span></span></div></div><div class="acard-rank">#'+(rank+1)+'</div></div></div>';
    }).join('');
    renderGChart(gs);
    renderTopSongs(data);
  },function(e){console.error(e)});
}

function renderTopSongs(allData){
  var songScores={};
  for(var j=0;j<allData.length;j++){
    var row=allData[j];if(!row.ratings)continue;
    for(var k=0;k<albums.length;k++){
      var alb=albums[k],aid=alb.id,o=origSongs[aid],tv=tvVaultSongs[aid];
      for(var si=0;si<o.length;si++){var v=(row.ratings[aid]||{})[si];if(v&&v>=1){var key=aid+'_'+si;if(!songScores[key])songScores[key]={sum:0,count:0,name:o[si],album:alb.name,color:alb.c};songScores[key].sum+=v;songScores[key].count++}}
      if(tv){for(var ti=0;ti<tv.s.length;ti++){var v2=(row.ratings[aid]||{})[o.length+ti];if(v2&&v2>=1){var key2=aid+'_v'+ti;if(!songScores[key2])songScores[key2]={sum:0,count:0,name:tv.s[ti],album:alb.name+' (TV)',color:alb.c};songScores[key2].sum+=v2;songScores[key2].count++}}}
    }
  }
  var arr=[];
  for(var k in songScores){if(songScores.hasOwnProperty(k)){var s=songScores[k];s.avg=s.sum/s.count;arr.push(s)}}
  arr.sort(function(a,b){return b.avg-a.avg});
  var top=arr.slice(0,50);
  var h='<div style="font-size:.78rem;color:#a09888;text-align:center;margin-bottom:8px">你可能是第 '+allData.length+' 位参与者</div>';
  for(var i=0;i<top.length;i++){
    var t=top[i];
    h+='<div style="display:flex;align-items:center;background:#1a1a1a;border-radius:8px;padding:6px 10px;margin-bottom:4px;border-left:3px solid '+t.color+'">';
    h+='<span style="width:28px;font-size:.75rem;color:#a09888;text-align:center">'+(i+1)+'</span>';
    h+='<span style="flex:1;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px">'+escapeText(t.name)+'</span>';
    h+='<span style="font-size:.7rem;color:#888;margin-right:6px">'+escapeText(t.album)+'</span>';
    h+='<span style="font-weight:700;color:#c9a96e;font-size:.9rem">'+t.avg.toFixed(2)+'</span>';
    h+='</div>';
  }
  document.getElementById('gTopSongs').innerHTML=h;
}

function renderGChart(stats){
  if(gc)gc.destroy();
  var lb=[];for(var i=0;i<stats.length;i++){if(stats[i].stats.mean!==null)lb.push(stats[i])}
  var lbls=[],vals=[],bgs=[],brds=[];
  for(var j=0;j<lb.length;j++){lbls.push(lb[j].name.length>12?lb[j].name.substring(0,11)+'…':lb[j].name);vals.push(lb[j].stats.mean);bgs.push(lb[j].c+'99');brds.push(lb[j].c)}
  var gctx=document.getElementById('gChartCanvas').getContext('2d');
  var gOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:8},color:'#a09888',maxRotation:45},grid:{display:false}},y:{min:1,max:10,ticks:{stepSize:2,font:{size:9},color:'#a09888'},grid:{color:'#333'}}},animation:{duration:500}};
  gc=new Chart(gctx,{type:'bar',data:{labels:lbls,datasets:[{data:vals,backgroundColor:bgs,borderColor:brds,borderWidth:2,borderRadius:4}]},options:gOpts});
}

document.getElementById('btnMean').onclick=function(){if(sm!=='mean'){sm='mean';renderResults(true)}};
document.getElementById('btnVar').onclick=function(){if(sm!=='variance'){sm='variance';renderResults(true)}};
document.getElementById('btnExport').onclick=function(){
  var ea=document.getElementById('exportArea');
  html2canvas(ea,{scale:2,backgroundColor:'#0d0d0d',allowTaint:true,useCORS:false}).then(function(cnv){
    var a=document.createElement('a');a.download='ts-ranking.png';a.href=cnv.toDataURL('image/png');a.click();showT('已导出');
  }).catch(function(e){showT('导出失败')});
};

function getAlbum(aid){for(var i=0;i<albums.length;i++){if(albums[i].id===aid)return albums[i]}return albums[0]}
function getAlbName(aid){var a=getAlbum(aid);return a?a.name:''}
function restartQuiz(){ratings={};saveR();ci=0;lastAlbumId=null;showPage('pageLanding');initLanding()}

loadR();initLanding();
</script>
</body>
